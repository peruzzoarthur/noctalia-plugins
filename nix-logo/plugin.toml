# Nix Logo — display the Nix logo (or any image) in your bar.
# Adapted to the new Noctalia plugin manifest format.

id = "peruzzoarthur/nix-logo"
name = "Nix Logo"
version = "1.0.1"
plugin_api = 3
author = "community"
license = "MIT"
dependencies = []
tags = ["nix", "logo", "image"]
icon = "image"
description = "Display the Nix logo (or any image) in the bar."

[[widget]]
id = "nix-logo"
entry = "nix-logo.luau"

  [[widget.setting]]
  key = "image_path"
  type = "file"
  label_key = "settings.image_path.label"
  description_key = "settings.image_path.description"
  default = "image.svg"
